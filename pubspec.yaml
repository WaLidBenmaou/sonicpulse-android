name: sonicpulse
description: "SonicPulse - Fast YouTube MP3 Downloader for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^2.2.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  open_file: ^3.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
